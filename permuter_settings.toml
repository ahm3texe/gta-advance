# decomp-permuter-agbcc settings.
# agbcc derives from GCC 2.8, so "gcc" is the right profile for the
# randomization weights.
compiler_type = "gcc"

# The build command is read from the PERMUTER=1 rule in the Makefile
# (see tools/permuter_compile.py -- external symbols are resolved with .equ).
build_system = "make"
